name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  Python side. 3.11 on purpose - it is what backend/Dockerfile installs, so
  #  a syntax or import error that only shows up on 3.11 fails here instead of
  #  on the server.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hack-pass/vid-source/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r hack-pass/vid-source/backend/requirements.txt

      - name: Import every module
        # server.py refuses to import without MONGO_URL, but the motor client
        # is lazy, so nothing actually connects to a database here. This pulls
        # in all five modules transitively and fails on any import-time error.
        working-directory: hack-pass/vid-source/backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: hackpass
          JWT_SECRET: ci-only-not-a-real-secret
        run: |
          python -c "import auth, deepfake_model, email_service, forensics, server; print('all modules import cleanly')"

      - name: Byte-compile every module
        run: python -m compileall -q hack-pass/vid-source/backend

  # ---------------------------------------------------------------------------
  #  Frontend. Same flags as frontend/Dockerfile so the two cannot drift.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend production build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hack-pass/vid-source/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache yarn downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('hack-pass/vid-source/frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable && yarn install --frozen-lockfile --network-timeout 600000

      - name: Build
        env:
          REACT_APP_BACKEND_URL: ""
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: yarn build

      - name: Assert the API base URL was baked in as "/api"
        # If REACT_APP_BACKEND_URL ever stops reaching the build, api.js emits
        # the literal string "undefined/api" and every request 404s in
        # production - silently, and only after the image is already deployed.
        run: |
          if grep -rq "undefined/api" build/static/js/; then
            echo "::error::REACT_APP_BACKEND_URL did not reach the build"
            exit 1
          fi
          echo "bundle resolves the API under /api"

  # ---------------------------------------------------------------------------
  #  The artifacts that actually ship.
  # ---------------------------------------------------------------------------
  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # docker-compose.yml refuses to interpolate without these; these are
      # throwaway CI values, never the production ones.
      DOMAIN: ci.example.com
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose -f hack-pass/vid-source/docker-compose.yml config --quiet

      - name: Build the API image
        run: docker build -f hack-pass/vid-source/backend/Dockerfile -t vid-api:ci hack-pass/vid-source

      - name: Build the web image
        run: docker build -f hack-pass/vid-source/frontend/Dockerfile -t vid-web:ci hack-pass/vid-source
