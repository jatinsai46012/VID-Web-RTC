# HTTPS - selected by render-site.sh once the certificate exists at
# /etc/letsencrypt/live/$DOMAIN/fullchain.pem.
#
# ${DOMAIN} is the only thing envsubst substitutes here (render-site.sh passes
# an explicit variable list); every other $variable is nginx's own and must
# survive untouched.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Mozilla-intermediate: TLS 1.2 with modern ciphers, plus TLS 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Both cookies in auth.py are set with secure=True and the recorder uses
    # navigator.mediaDevices.getUserMedia, so HTTPS is not optional here - it
    # is what makes login and microphone capture work at all.
    #
    # HSTS pins this hostname to HTTPS for a year. Keep it: the site is
    # HTTPS-only, and it stops the first request of a session going out in
    # the clear. (Remove it only if you ever deliberately go back to HTTP.)
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/tpl/_server.conf.inc;

    # Still served on 80 so `certbot renew` can complete its HTTP-01 check.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/tpl/_locations.conf.inc;
}


# Port 80 once TLS is live: keep the ACME webroot reachable, redirect the rest.
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
