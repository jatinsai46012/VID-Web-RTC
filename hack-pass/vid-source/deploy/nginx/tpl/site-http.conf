# Plain HTTP - used until Let's Encrypt has issued a certificate, at which
# point render-site.sh swaps this file for site-https.conf.
#
# The ACME webroot lives on port 80 in BOTH configs: renewal is also an
# HTTP-01 challenge, so it has to keep working for as long as the cert is
# renewed. Removing it here would be the classic "worked once, then silently
# stopped renewing" failure.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/tpl/_server.conf.inc;

    # certbot writes the token to /var/www/certbot/.well-known/acme-challenge/
    # (webroot -w) and nginx must serve it from exactly that path.
    # `^~` pins this against any longer-matching regex location.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/tpl/_locations.conf.inc;
}
